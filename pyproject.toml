[project]
name = "academic-ai-compute-tuqs"
version = "1.1.0"
description = "Token Usage & Quota Service (TUQS) - Module 8 for Academic AI Compute Fabric"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Alexis Delgado", email = "alexis.delgado@university.edu" },
    { name = "Valentina Gómez", email = "valentina.gomez@university.edu" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "ruff>=0.3.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 110
target-version = "py311"
